<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký tài khoản - ABC_Shop</title>
</head>
<body>
    <h1>Đăng ký tài khoản ABC_Shop</h1>

    <form action="#" method="POST">
        <fieldset>
            <legend>Thông tin cá nhân</legend>

            <label for="fullname">Họ và tên *</label>
            <input type="text" id="fullname" name="fullname" required
                    minlength="2" maxlength="50" placeholder="Nguyễn Văn A">

            <label for="email">Email</label>
            <input type="email" id="email" name="email" required
                    placeholder="you@example.com">

            <label for="phone">Số điện thoại *</label>
            <input type="tel" id="phone" name="phone" required
                    pattern="[0-9]{10}" placeholder="0901234567"
                    title="Đúng 10 chữ số">
            
            <label for="dob">Ngày sinh</label>
            <input type="date" id="dob" name="dob"
                    max="2026-4-25" placeholder="yyyy-mm-dd">
        </fieldset>

        <fieldset>
            <legend>Tài khoản</legend>

            <label for="username">Username *</label>
            <input type="text" id="username" name="username" required
                    pattern="[A-Za-z0-9_]{3,20}"
                    placeholder="vd: liti_user01"
                    title="3-20 ký tự: chữ, số, gạch dưới">

            <label for="pwd">Mật khẩu *</label>
            <input type="password" id="pwd" name="pwd" required
                    minlength="8"
                    pattern="(?=.*[A-Z])(?=.*\d).{8,}"
                    placeholder="Tối thiểu 8 ký tự"
                    title="Ít nhất 8 ký tự, có 1 chữ hoa và 1 số">

            <label for="pwd2">Xác nhận mật khẩu *</label>
            <input type="password" id="pwd2" name="pwd2" required
                    minlength="8"
                    pattern="(?=.*[A-Z])(?=.*\d).{8,}"
                    placeholder="Nhập lại mật khẩu"
                    title="Phải khớp với mật khẩu ở trên">
        </fieldset>

        <fieldset>
            <legend>Thông tin giao hàng</legend>

            <label for="city">Tỉnh/Thành phố *</label>
            <select id="city" name="city" required>
                <option value="">-- Chọn --</option>
                <option value="HN">Hà Nội</option>
                <option value="HCM">TP. Hồ Chí Minh</option>
                <option value="DN">Đà Nẵng</option>
                <option value="HP">Hải Phòng</option>
                <option value="CT">Cần Thơ</option>
            </select>

            <label for="district">Quận/Huyện *</label>
            <select id="district" name="district" required>
                <option value="">-- Chọn --</option>
                <option>Quận 1</option>
                <option>Quận 3</option>
                <option>Quận Hoàn Kiếm</option>
                <option>Quận Hải Châu</option>
            </select>
            
            <label for="address">Địa chỉ chi tiết *</label>
            <textarea id="address" name="address" rows="3" required
                        placeholder="Số nhà, tên đường, phường/xã..."></textarea>

            <fieldset>
                <legend>Giới tính</legend>
                <label><input type="radio" name="gender" value="male" required>Nam</label>
                <label><input type="radio" name="gender" value="female">Nữ</label>
                <label><input type="radio" name="gender" value="other">Khác</label>
            </fieldset>
        </fieldset>

        <p>
            <label>
                <input type="checkbox" name="agreee" required>
                Tôi đồng ý với <a href="#">Điều khoảng dịch vụ</a> và <a href="#">Chính sách bảo mật</a>
            </label>
        </p>

        <p>
            <button type="reset">Nhập lại</button>
            <button type="submit">Đăng ký</button>
        </p>
    </form>
</body>
</html>
