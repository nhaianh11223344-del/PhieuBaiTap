<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animations</title>
  <link rel="stylesheet" href="animations.css" />
</head>
<body>
  <header class="anim-header">
    <h1>Product Animations</h1>
    <p>Hover the cards and buttons to see transitions.</p>
  </header>

  <section class="card-grid">
    <article class="card fade-in">
      <div class="card-image">
        <img src="https://picsum.photos/seed/a1/500/360" alt="Product" />
      </div>
      <h3>Card Hover</h3>
      <p>Smooth lift and shadow on hover.</p>
      <button class="btn-buy">Mua ngay</button>
    </article>
    <article class="card fade-in" style="animation-delay: 0.1s;">
      <div class="card-image">
        <img src="https://picsum.photos/seed/a2/500/360" alt="Product" />
      </div>
      <h3>Image Zoom</h3>
      <p>Image scales within a clipped frame.</p>
      <button class="btn-buy">Mua ngay</button>
    </article>
    <article class="card fade-in" style="animation-delay: 0.2s;">
      <div class="card-image">
        <img src="https://picsum.photos/seed/a3/500/360" alt="Product" />
      </div>
      <h3>Button Hover</h3>
      <p>Color and scale transition.</p>
      <button class="btn-buy">Mua ngay</button>
    </article>
  </section>

  <section class="loader-section">
    <h2>Loading Spinner</h2>
    <div class="spinner" aria-label="Loading"></div>
  </section>
</body>
</html>
