<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Selectors Test</title>
    <style>
        h1 {
            color: purple;
        }

        .price {
            color: red;
        }

        nav a:first-child {
            font-weight: bold;
        }

        .product.featured h2 {
            color: blue;
        }

        article > p {
            background-color: #f0f0f0;
        }

        a[href="/"] {
            text-decoration: underline;
        }

        .top-bar.dark h1 {
            background-color: yellow;
        }
    </style>
</head>
<body>
<div id="app">
    <header class="top-bar dark">
        <h1>ShopTLU</h1>
        <nav>
            <a href="/" class="active">Home</a>
            <a href="/products">Products</a>
            <a href="/about">About</a>
        </nav>
    </header>
    <main>
        <article class="product">
            <h2>iPhone 16</h2>
            <p class="price">25.990.000đ</p>
            <p>Mô tả sản phẩm...</p>
        </article>
        <article class="product featured">
            <h2>MacBook Pro</h2>
            <p class="price">45.990.000đ</p>
            <p>Mô tả sản phẩm...</p>
        </article>
    </main>
</div>
</body>
</html>
